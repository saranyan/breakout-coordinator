name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run the simulated demo
        run: python -m breakout demo --document examples/review.txt
