[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breakout-coordinator"
version = "0.2.0"
description = "Start a small team of AI agents (Claude, Codex, any OpenAI-compatible API) from the conversation you're in, and get a reviewed artifact back."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/saranyan/breakout-coordinator"
Issues = "https://github.com/saranyan/breakout-coordinator/issues"
Changelog = "https://github.com/saranyan/breakout-coordinator/blob/main/CHANGELOG.md"

[project.scripts]
breakout = "breakout.cli:main"

[tool.setuptools.packages.find]
include = ["breakout*"]

[tool.setuptools.package-data]
breakout = ["assets/*.md", "assets/*.json"]
